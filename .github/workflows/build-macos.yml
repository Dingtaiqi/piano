name: Build macOS Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: macos-latest  # GitHub 免费提供 macOS runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Rust 原生库 ----
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build Rust (x86_64)
        run: cd rust && cargo build --release --target x86_64-apple-darwin

      - name: Build Rust (aarch64)
        run: cd rust && cargo build --release --target aarch64-apple-darwin

      - name: Create universal dylib
        run: |
          cd rust
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/libpiano_native.dylib \
            target/aarch64-apple-darwin/release/libpiano_native.dylib \
            -output target/release/libpiano_native.dylib

      # ---- Flutter ----
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods deps
        run: brew install automake libtool

      - name: Build Flutter macOS
        run: flutter build macos --release

      # ---- 打包 ----
      - name: Copy dylib into app bundle
        run: |
          APP="build/macos/Build/Products/Release/eda_piano.app"
          cp rust/target/release/libpiano_native.dylib "$APP/Contents/MacOS/"

      - name: Package app
        run: |
          APP="build/macos/Build/Products/Release/eda_piano.app"
          ditto -c -k --keepParent "$APP" EDA-Piano-macOS.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: EDA-Piano-macOS
          path: EDA-Piano-macOS.zip
